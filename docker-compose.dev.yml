services:
  gem-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gem-backend-dev
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - PORT=7700
      - NODE_ENV=development
    volumes:
      - ./gem-tenders.js:/app/gem-tenders.js
      - ./gem-tenders.log:/app/gem-tenders.log
    networks:
      - bidwatch-dev-net

  gem-frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: gem-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:7700
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - gem-backend
    networks:
      - bidwatch-dev-net

networks:
  bidwatch-dev-net:
    driver: bridge
